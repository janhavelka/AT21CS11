name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  PLATFORMIO_VERSION: "6.1.19"
  DOXYGEN_VERSION: "1.9.8+ds-2ubuntu0.1"

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python -m platformio test -e native

  native-sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python -m platformio test -e native_sanitize

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python tools/check_core_timing_guard.py
      - run: python tools/check_no_production_placeholders.py
      - name: Verify S2 timing code remains in IRAM
        shell: bash
        run: |
          python -m platformio run -d test/consumer/phy_smoke/arduino -e phy_smoke_s2
          objdump="$(find "$HOME/.platformio/packages" -type f -name 'xtensa-esp32s2-elf-objdump' -print -quit)"
          object="$(find test/consumer/phy_smoke/arduino/.pio/build/phy_smoke_s2 -type f -path '*/platform/esp32/Esp32Transport.cpp.o' -print -quit)"
          test -n "$objdump"
          test -n "$object"
          python tools/check_esp32_iram_sections.py --objdump "$objdump" --object "$object"
      - name: Verify S3 timing code remains in IRAM
        shell: bash
        run: |
          python -m platformio run -d test/consumer/phy_smoke/arduino -e phy_smoke_s3
          objdump="$(find "$HOME/.platformio/packages" -type f -name 'xtensa-esp32s3-elf-objdump' -print -quit)"
          object="$(find test/consumer/phy_smoke/arduino/.pio/build/phy_smoke_s3 -type f -path '*/platform/esp32/Esp32Transport.cpp.o' -print -quit)"
          test -n "$objdump"
          test -n "$object"
          python tools/check_esp32_iram_sections.py --objdump "$objdump" --object "$object"

  docs-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: sudo apt-get update && sudo apt-get install --yes "doxygen=${DOXYGEN_VERSION}"
      - run: python tools/check_cli_contract.py
      - run: python tools/check_docs.py
      - run: python tools/check_idf_example_contract.py
      - run: python tools/test_check_idf_example_contract.py

  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/generate_version.py --check
      - name: Verify byte-identical generation
        run: |
          python scripts/generate_version.py
          sha256sum include/AT21CS/Version.h > /tmp/version.sha256
          python scripts/generate_version.py
          sha256sum --check /tmp/version.sha256
          git diff --exit-code -- include/AT21CS/Version.h

  package-inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python tools/check_package.py --inspect

  package-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python tools/check_package.py --build-platform-neutral

  package-arduino:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python tools/check_package.py --build-arduino

  phy-smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: phy_smoke_s2
          - environment: phy_smoke_s3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python -m platformio run -d test/consumer/phy_smoke/arduino -e ${{ matrix.environment }}

  esp-idf-example:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3, esp32s2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.target }}
          path: examples/esp_idf/basic
          command: |
            set -euo pipefail
            exec > >(tee example-build.log) 2>&1
            idf.py set-target "$IDF_TARGET" build
            objdump="$(command -v "xtensa-$IDF_TARGET-elf-objdump")"
            object="$(find build -type f -name Esp32Transport.cpp.obj)"
            python ../../../tools/check_esp32_iram_sections.py --objdump "$objdump" --object "$object" \
              --require-undefined esp_timer_get_time esp_rom_delay_us vTaskSuspendAll xTaskResumeAll gpio_config
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: esp-idf-example-${{ matrix.target }}
          path: examples/esp_idf/basic/example-build.log
          if-no-files-found: error

  esp-idf-smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3, esp32s2]
        profile: [default, pm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.target }}
          path: test/consumer/phy_smoke/idf
          command: |
            set -euo pipefail
            exec > >(tee smoke-build.log) 2>&1
            defaults=sdkconfig.defaults
            symbols=(esp_timer_get_time esp_rom_delay_us vTaskSuspendAll xTaskResumeAll gpio_config)
            elf_args=()
            if [[ "${{ matrix.profile }}" == pm ]]; then
              defaults="sdkconfig.defaults;sdkconfig.pm"
              symbols+=(esp_pm_lock_acquire esp_pm_lock_release)
              elf_args=(--elf build/at21cs_phy_smoke.elf)
            fi
            idf.py -D "SDKCONFIG_DEFAULTS=$defaults" set-target "$IDF_TARGET" build
            grep -Fx "CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=240" sdkconfig
            grep -Fx "CONFIG_FREERTOS_HZ=1000" sdkconfig
            grep -Fx "CONFIG_COMPILER_OPTIMIZATION_SIZE=y" sdkconfig
            objdump="$(command -v "xtensa-$IDF_TARGET-elf-objdump")"
            object="$(find build -type f -name Esp32Transport.cpp.obj)"
            python ../../../../tools/check_esp32_iram_sections.py --objdump "$objdump" --object "$object" \
              "${elf_args[@]}" --require-undefined "${symbols[@]}"
            if [[ "${{ matrix.profile }}" == default ]]; then
              grep -Fx "# CONFIG_PM_ENABLE is not set" sdkconfig
              "$objdump" -t "$object" > build/backend-symbols.txt
              if grep -E "[*]UND[*].*esp_pm_lock_(acquire|release)$" build/backend-symbols.txt; then
                echo "PM-disabled Backend references a PM lock"
                exit 1
              fi
            fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: esp-idf-smoke-${{ matrix.target }}-${{ matrix.profile }}
          path: test/consumer/phy_smoke/idf/smoke-build.log
          if-no-files-found: error

  package-payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - name: Export validated archive and checksum
        shell: bash
        run: python tools/check_package.py --export-archive payload 2>&1 | tee "$RUNNER_TEMP/export.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-payload
          path: payload/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-export-log
          path: ${{ runner.temp }}/export.log
          if-no-files-found: error

  package-idf:
    needs: package-payload
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3, esp32s2]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-payload
          path: payload
      - name: Verify and extract the native consumer
        shell: bash
        run: |
          exec > >(tee consumer-verify.log) 2>&1
          (cd payload && sha256sum --check --strict SHA256SUMS)
          mkdir consumer
          tar -xzf payload/AT21CS01_AT21CS11-2.0.0.tar.gz -C consumer
          cd consumer/examples/esp_idf/basic
          for file in CMakeLists.txt README.md sdkconfig.defaults sdkconfig.defaults.esp32s2 sdkconfig.defaults.esp32s3 \
                      components/AT21CS01_AT21CS11/CMakeLists.txt main/CMakeLists.txt main/GenerateBuildIdentity.cmake main/main.cpp; do
            test -f "$file" || { echo "Missing packaged example file: $file"; exit 1; }
          done
      - uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.target }}
          path: consumer/examples/esp_idf/basic
          command: |
            set -euo pipefail
            exec > >(tee package-build.log) 2>&1
            idf.py set-target "$IDF_TARGET" build
            identity=build/esp-idf/main/AT21CSBuildIdentity.h
            grep -Fx "#define AT21CS_GIT_COMMIT \"unknown\"" "$identity"
            grep -Fx "#define AT21CS_GIT_STATUS \"unknown\"" "$identity"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-idf-${{ matrix.target }}
          path: |
            consumer-verify.log
            consumer/examples/esp_idf/basic/package-build.log
          if-no-files-found: error
