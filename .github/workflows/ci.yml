name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  PLATFORMIO_VERSION: "6.1.19"
  DOXYGEN_VERSION: "1.9.8+ds-2ubuntu0.1"

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python -m platformio test -e native

  native-sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python -m platformio test -e native_sanitize

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python tools/check_core_timing_guard.py
      - run: python tools/check_no_production_placeholders.py
      - name: Verify S2 timing code remains in IRAM
        shell: bash
        run: |
          python -m platformio run -d test/consumer/phy_smoke/arduino -e phy_smoke_s2
          objdump="$(find "$HOME/.platformio/packages" -type f -name 'xtensa-esp32s2-elf-objdump' -print -quit)"
          object="$(find test/consumer/phy_smoke/arduino/.pio/build/phy_smoke_s2 -type f -path '*/platform/esp32/Esp32Transport.cpp.o' -print -quit)"
          test -n "$objdump"
          test -n "$object"
          python tools/check_esp32_iram_sections.py --objdump "$objdump" --object "$object"
      - name: Verify S3 timing code remains in IRAM
        shell: bash
        run: |
          python -m platformio run -d test/consumer/phy_smoke/arduino -e phy_smoke_s3
          objdump="$(find "$HOME/.platformio/packages" -type f -name 'xtensa-esp32s3-elf-objdump' -print -quit)"
          object="$(find test/consumer/phy_smoke/arduino/.pio/build/phy_smoke_s3 -type f -path '*/platform/esp32/Esp32Transport.cpp.o' -print -quit)"
          test -n "$objdump"
          test -n "$object"
          python tools/check_esp32_iram_sections.py --objdump "$objdump" --object "$object"

  docs-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: sudo apt-get update && sudo apt-get install --yes "doxygen=${DOXYGEN_VERSION}"
      - run: python tools/check_cli_contract.py
      - run: python tools/check_docs.py

  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/generate_version.py --check
      - name: Verify byte-identical generation
        run: |
          python scripts/generate_version.py
          sha256sum include/AT21CS/Version.h > /tmp/version.sha256
          python scripts/generate_version.py
          sha256sum --check /tmp/version.sha256
          git diff --exit-code -- include/AT21CS/Version.h

  package-inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python tools/check_package.py --inspect

  package-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python tools/check_package.py --build-platform-neutral

  package-arduino:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python tools/check_package.py --build-arduino

  phy-smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: phy_smoke_s2
          - environment: phy_smoke_s3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --disable-pip-version-check platformio==${PLATFORMIO_VERSION}
      - run: python -m platformio run -d test/consumer/phy_smoke/arduino -e ${{ matrix.environment }}
