[platformio]
default_envs = phy_smoke_s2, phy_smoke_s3

[dependency_pins]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

[env]
platform = ${dependency_pins.platform}
framework = arduino
lib_deps = symlink://../../../..
lib_ldf_mode = deep+
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Werror=return-type
  -DAT21CS_SMOKE_SIO_PIN=-1
  -DAT21CS_SMOKE_PRESENCE_PIN=-1

[env:phy_smoke_s2]
extends = env
board = esp32-s2-saola-1

[env:phy_smoke_s3]
extends = env
board = esp32-s3-devkitc-1
