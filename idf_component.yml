version: "2.0.0"
description: "Single-wire EEPROM driver for Microchip AT21CS01 and AT21CS11 on ESP32-S2/S3."
license: "MIT"
maintainers:
  - "Jan Havelka (THYMOS Solution s.r.o.) <info@thymos.cz>"
url: "https://github.com/janhavelka/AT21CS11"
repository: "https://github.com/janhavelka/AT21CS11.git"
targets:
  - esp32s2
  - esp32s3
dependencies:
  idf: ">=6.0.1"
files:
  exclude:
    - ".github/**/*"
    - "**/.pio/**/*"
    - "platformio.ini"
    - "library.json"
    - "test/**/*"
    - "tools/**/*"
    - "scripts/**/*"
    - "Doxyfile"
    - "docs/doxygen/**/*"
    - "docs/CODE_AUDIT*.md"
    - "docs/STANDARD_SPEED_RESERVATION_FOLLOWUP.md"
    - "docs/prompts/**/*"
    - "docs/*.pdf"
    - "**/build*/**/*"
    - "**/sdkconfig.esp32*"
    - "**/*.log"
